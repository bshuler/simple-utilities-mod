# Per-cell override, NOT read by the sibling 1.21.4-neoforge cell (which shares
# versions/dependencies/1.21.4.properties). Yarn mappings are requested only for
# this Fabric cell - see build.gradle.kts / PLAN.md for why: Stonecraft's own
# DependenciesKt auto-wires "mappings" from mod.hasProp("yarn_mappings"), but for
# NeoForge cells it additionally requires a "yarn_mappings_neoforge_patch" layered
# on top (dev.architectury:yarn-mappings-patch-neoforge), and that artifact is
# only published up to MC 1.21 (confirmed via
# https://maven.architectury.dev/dev/architectury/yarn-mappings-patch-neoforge/maven-metadata.xml)
# - nothing exists for 1.21.4. Keeping yarn_mappings out of the shared
# versions/dependencies/1.21.4.properties file means the neoforge cell never sees
# hasProp("yarn_mappings")==true and cleanly falls back to Loom's
# officialMojangMappings(), which is fine since the neoforge cell (like the forge
# stub cells at 1.18.2/1.19.4/1.20.1) doesn't reference any net.minecraft class
# yet - see SimpleUtilities.java's class javadoc.
yarn_mappings=1.21.4+build.8
