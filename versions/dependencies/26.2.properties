# Minecraft 26.2 is fully unobfuscated (Mojang official names) - Fabric
# stopped publishing Yarn mappings after 1.21.11, so there is no yarn_mappings
# key here (no per-cell gradle.properties override needed either, unlike
# 1.21.4-fabric): this cell's fabric build is scoped to config-only, the same
# way the forge/neoforge stub cells are, so it never references a
# Yarn-mapped net.minecraft class in the first place. See PLAN.md "26.2" for
# the full writeup and the follow-up plan to port the HUD-render feature
# using FlightHud's HudHooks/PlatformCanvas pattern.
minecraft_version=26.2
loader_version=0.19.3

# Fabric API
fabric_version=0.156.0+26.2

# NeoForge
neoforge_version=26.2.0.58
